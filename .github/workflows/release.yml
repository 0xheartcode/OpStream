name: Release

# Triggers when a PR is merged into main.
# Reads the semver label, bumps package.json, prepends a CHANGELOG entry,
# commits, and tags. The commit message contains [skip ci] to avoid
# re-triggering the CI workflow.
#
# Required labels (create in repo Settings → Labels):
#   semver:patch   — default, bumps x.y.Z
#   semver:minor   — bumps x.Y.z
#   semver:major   — bumps X.y.z

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    name: Bump version and update changelog
    runs-on: ubuntu-latest
    if: github.event.pull_request.merged == true

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Determine version bump type
        id: bump
        run: |
          LABELS='${{ toJson(github.event.pull_request.labels.*.name) }}'
          if echo "$LABELS" | grep -q 'semver:major'; then
            echo "type=major" >> $GITHUB_OUTPUT
          elif echo "$LABELS" | grep -q 'semver:minor'; then
            echo "type=minor" >> $GITHUB_OUTPUT
          else
            echo "type=patch" >> $GITHUB_OUTPUT
          fi

      - name: Bump version in package.json
        id: version
        run: |
          npm version ${{ steps.bump.outputs.type }} --no-git-tag-version
          NEW=$(node -p "require('./package.json').version")
          echo "new=$NEW" >> $GITHUB_OUTPUT

      - name: Prepend CHANGELOG entry
        env:
          NEW_VERSION: ${{ steps.version.outputs.new }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          node << 'SCRIPT'
          const fs   = require('fs');
          const ver  = process.env.NEW_VERSION;
          const date = new Date().toISOString().slice(0, 10);
          const pr   = process.env.PR_NUMBER;
          const title = process.env.PR_TITLE;

          const entry = `\n## [${ver}] - ${date}\n- ${title} (#${pr})\n`;
          const current = fs.readFileSync('CHANGELOG.md', 'utf8');
          // Insert after the first "---" separator line
          const updated = current.replace(/^---$/m, `---\n${entry}`);
          fs.writeFileSync('CHANGELOG.md', updated);
          SCRIPT

      - name: Commit, tag, and push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json CHANGELOG.md
          git commit -m "chore: release v${{ steps.version.outputs.new }} [skip ci]"
          git tag "v${{ steps.version.outputs.new }}"
          git push origin main --follow-tags

      - name: Sync release commit back to dev
        run: |
          git fetch origin dev
          git checkout dev
          git merge origin/main --no-edit
          git push origin dev
