# OpStream — Docker Compose
#
# Run from the OpStream/ directory:
#
#   SQLite (default):
#     docker compose up -d
#
#   Postgres (bundled):
#     docker compose --profile postgres up -d
#
#   Postgres + mempool:
#     docker compose --profile postgres --profile mempool up -d

services:
  opstream:
    build:
      context: .
      dockerfile: Dockerfile
    image: opstream:latest
    container_name: opstream
    restart: unless-stopped
    env_file: .env
    ports:
      - "${RPC_PORT:-3001}:3001"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
        required: false
    healthcheck:
      test: ["CMD", "sh", "-c", "test -f /app/data/opstream.db || sleep 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  opstream-mempool:
    build:
      context: .
      dockerfile: Dockerfile
    image: opstream:latest
    container_name: opstream-mempool
    profiles: [mempool]
    restart: unless-stopped
    env_file: .env
    environment:
      OPSTREAM_MODE: mempool
    command: ["npx", "tsx", "src/main.ts", "live"]
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    depends_on:
      opstream:
        condition: service_healthy
        required: false
      postgres:
        condition: service_healthy
        required: false

  postgres:
    image: postgres:16-alpine
    container_name: opstream-postgres
    profiles: [postgres]
    restart: unless-stopped
    environment:
      POSTGRES_DB:       opstream
      POSTGRES_USER:     opstream
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-opstream_secret}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opstream -d opstream"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
